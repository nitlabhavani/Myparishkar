<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Registration - My Parishkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #43a047;
    --primary-dark: #1b5e20;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #0d3b1e 0%, #1b5e20 50%, #2e7d32 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }

  .signup-card {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(16px);
    padding: 40px 36px;
    border-radius: 20px;
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.28);
    width: 100%;
    max-width: 440px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    position: relative;
    z-index: 10;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .brand-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e8f5e9;
    color: var(--primary);
    padding: 5px 14px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .lang-select {
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid #c8e6c9;
    background: #f1f8f3;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    outline: none;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.85rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #6b7280;
    font-size: 0.92rem;
    margin-bottom: 22px;
  }

  .messages {
    margin-bottom: 18px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.88rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .alert-error {
    background-color: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }

  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 5px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.05rem;
    color: #9ca3af;
    pointer-events: none;
  }

  input[type="text"],
  input[type="email"], 
  input[type="password"] {
    width: 100%;
    padding: 12px 42px 12px 40px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s;
    background: #f9fafb;
  }

  input:focus {
    border-color: var(--primary);
    background: #ffffff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
  }

  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    color: #6b7280;
  }

  .strength-meter {
    height: 4px;
    width: 100%;
    background: #e5e7eb;
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  .strength-bar {
    height: 100%;
    width: 0%;
    transition: all 0.3s ease;
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 10px;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.35);
  }

  .submit-btn:hover {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(46, 125, 50, 0.45);
  }

  .links {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    font-size: 0.88rem;
  }

  .links a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="signup-card">
  <div class="top-row">
    <span class="brand-chip">✨ <span data-translate="user_signup_btn">Registration</span></span>
    <select id="language" class="lang-select">
      <option value="en">English</option>
      <option value="te">తెలుగు</option>
    </select>
  </div>

  <h1 data-translate="signup_title">Join My Parishkar</h1>
  <p class="subtitle" data-translate="signup_subtitle">Create an account to apply for government welfare schemes</p>

  {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          <span>⚠️</span>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST" action="{% url 'user_signup' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="name" data-translate="full_name">Full Name</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" id="name" name="name" value="{{ name|default:'' }}" placeholder="e.g. Ramesh Kumar" required autocomplete="name">
      </div>
    </div>

    <div class="form-group">
      <label for="email" data-translate="email_address">Email Address</label>
      <div class="input-wrapper">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" name="email" value="{{ email|default:'' }}" placeholder="ramesh@example.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label for="password" data-translate="create_password">Create Password</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">👁️</button>
      </div>
      <div class="strength-meter">
        <div id="strengthBar" class="strength-bar"></div>
      </div>
    </div>

    <button type="submit" class="submit-btn" data-translate="signup_btn">Create Citizen Account</button>
  </form>

  <div class="links">
    <div><span data-translate="already_account">Already have an account?</span> <a href="{% url 'user_login' %}" data-translate="login_here">Log In Here</a></div>
    <div><a href="{% url 'home' %}" data-translate="back_to_gateway">← Back to Main Gateway</a></div>
  </div>
</div>

<script src="/static/js/translations.js"></script>
<script>
  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁️';
    }
  }

  function checkStrength(val) {
    const bar = document.getElementById('strengthBar');
    if (!val) {
      bar.style.width = '0%';
      return;
    }
    let score = 0;
    if (val.length >= 6) score += 35;
    if (val.length >= 10) score += 25;
    if (/[A-Z]/.test(val)) score += 20;
    if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 20;

    bar.style.width = Math.min(score, 100) + '%';
    if (score < 40) bar.style.backgroundColor = '#ef4444';
    else if (score < 75) bar.style.backgroundColor = '#f59e0b';
    else bar.style.backgroundColor = '#10b981';
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheme Eligibility Calculator - My Parishkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #4caf50;
    --primary-dark: #1b5e20;
    --accent: #f59e0b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f4f7f5;
    color: #1f2937;
    min-height: 100vh;
  }

  /* Navigation Bar */
  .top-navbar {
    background: #0d3b1e;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .nav-brand {
    color: white;
    font-family: 'Outfit', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .lang-select {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
  }

  .lang-select option {
    color: #111827;
  }

  .back-btn {
    background: rgba(255, 255, 255, 0.9);
    color: var(--primary-dark);
    text-decoration: none;
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: white;
    transform: translateY(-1px);
  }

  /* Hero Banner */
  .hero-header {
    background: linear-gradient(135deg, #0d3b1e 0%, #1b5e20 50%, #2e7d32 100%);
    color: white;
    padding: 45px 20px 45px;
    text-align: center;
  }

  .badge-tag {
    display: inline-block;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .hero-header h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 2.3rem;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .hero-header p {
    font-size: 1.05rem;
    opacity: 0.92;
    max-width: 650px;
    margin: 0 auto;
  }

  /* Main Container Layout */
  .layout-container {
    max-width: 1200px;
    margin: 35px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* Calculator Form Card */
  .calc-card {
    background: white;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    border: 1px solid #e5e7eb;
    position: sticky;
    top: 90px;
  }


  .calc-card h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  select, input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    background: #f9fafb;
  }

  select:focus, input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
  }

  .reset-btn {
    width: 100%;
    padding: 10px;
    background: #f3f4f6;
    color: #4b5563;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
  }

  .reset-btn:hover {
    background: #e5e7eb;
    color: #111827;
  }

  /* Results Section */
  .results-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .results-header {
    background: white;
    padding: 18px 24px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    border: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .results-count {
    font-family: 'Outfit', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #111827;
  }

  .results-count span {
    color: var(--primary);
  }

  .sector-filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: #f3f4f6;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    color: #4b5563;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--primary);
    color: white;
  }

  /* Scheme Match Cards Grid */
  .matches-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .match-card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    border: 1px solid #e5e7eb;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .match-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(46, 125, 50, 0.14);
    border-color: #81c784;
  }

  .match-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .match-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #111827;
  }

  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .score-100 { background: #dcfce7; color: #15803d; }
  .score-high { background: #e0f2fe; color: #0369a1; }
  .score-mid { background: #fef3c7; color: #b45309; }

  .benefit-ribbon {
    background: #f0fdf4;
    border-left: 4px solid var(--primary);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 12px;
  }

  .match-desc {
    font-size: 0.92rem;
    color: #4b5563;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .qualify-reasons {
    list-style: none;
    margin-bottom: 18px;
    background: #f8fafc;
    padding: 10px 14px;
    border-radius: 8px;
  }

  .qualify-reasons li {
    font-size: 0.82rem;
    color: #334155;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .qualify-reasons li span {
    color: var(--primary);
    font-weight: bold;
  }

  .match-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .apply-btn {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    background: linear-gradient(135deg, #2e7d32 0%, #43a047 100%);
    color: white;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s;
  }

  .apply-btn:hover {
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
  }

  .official-link {
    padding: 10px 14px;
    background: #f1f5f9;
    color: #334155;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
  }

  .official-link:hover {
    background: #e2e8f0;
  }

  @media (max-width: 900px) {
    .layout-container {
      grid-template-columns: 1fr;
    }
    .calc-card {
      position: static;
    }
  }
</style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="top-navbar">
  <a href="{% url 'home' %}" class="nav-brand">
    <span>🌾</span>
    <span data-translate="app_title">My Parishkar</span>
  </a>
  <div class="nav-right">
    <select id="language" class="lang-select">
      <option value="en">English</option>
      <option value="te">తెలుగు</option>
    </select>
    <a href="{% url 'user_main' %}" class="back-btn" data-translate="back_to_dashboard">← Back to Dashboard</a>
  </div>
</nav>

<!-- Hero Banner -->
<header class="hero-header">
  <div class="badge-tag">🎯 Smart Citizen Tool</div>
  <h1 data-translate="calc_title">Scheme Eligibility Calculator</h1>
  <p data-translate="calc_sub">Answer a few simple profile questions to find all welfare schemes you qualify for</p>
</header>

<div class="layout-container">
  <!-- Calculator Profile Inputs -->
  <div class="calc-card">
    <h2 data-translate="calc_profile_head">⚙️ Your Citizen Profile</h2>


    <div class="form-group">
      <label for="occupation" data-translate="calc_occ_label">Primary Occupation / Category</label>
      <select id="occupation" onchange="runCalculator()">
        <option value="all" data-translate="occ_all">Any / General Citizen</option>
        <option value="farmer" data-translate="occ_farmer">Farmer / Landowner</option>
        <option value="student" data-translate="occ_student">Student / Scholar</option>
        <option value="worker" data-translate="occ_worker">Unorganized / Daily Wage Worker</option>
        <option value="homeless" data-translate="occ_homeless">Homeless / Renting Citizen</option>
      </select>
    </div>

    <div class="form-group">
      <label for="income" data-translate="calc_income_label">Annual Household Income</label>
      <select id="income" onchange="runCalculator()">
        <option value="bpl" data-translate="inc_bpl">Below ₹1,00,000 (BPL / Low Income)</option>
        <option value="ews" data-translate="inc_ews">₹1,00,000 - ₹2,50,000 (EWS)</option>
        <option value="mig" data-translate="inc_mig">₹2,50,000 - ₹5,00,000 (Middle Income)</option>
        <option value="high" data-translate="inc_high">Above ₹5,00,000</option>
      </select>
    </div>

    <div class="form-group">
      <label for="land" data-translate="calc_land_label">Agricultural Land Holding</label>
      <select id="land" onchange="runCalculator()">
        <option value="any" data-translate="land_any">Not Applicable</option>
        <option value="small" data-translate="land_small">Small / Marginal Farmer (< 2 Hectares)</option>
        <option value="large" data-translate="land_large">Medium or Large Farmer (> 2 Hectares)</option>
        <option value="none" data-translate="land_none">No Agricultural Land</option>
      </select>
    </div>

    <div class="form-group">
      <label for="education" data-translate="calc_edu_label">Education Status</label>
      <select id="education" onchange="runCalculator()">
        <option value="any" data-translate="edu_any">Not Enrolled / Completed</option>
        <option value="college" data-translate="edu_college">College / Degree / ITI / Polytechnic</option>
        <option value="school" data-translate="edu_school">Primary / High School Student</option>
      </select>
    </div>

    <div class="form-group">
      <label for="housing" data-translate="calc_house_label">Current Housing Type</label>
      <select id="housing" onchange="runCalculator()">
        <option value="any" data-translate="house_any">Any Housing Condition</option>
        <option value="rent" data-translate="house_rent">Rented House / Migrant Accommodation</option>
        <option value="kutcha" data-translate="house_kutcha">Kutcha / Temporary House</option>
        <option value="pucca" data-translate="house_pucca">Own Pucca House</option>
      </select>
    </div>

    <button type="button" class="reset-btn" onclick="resetForm()" data-translate="calc_reset_btn">Reset Criteria ↺</button>
  </div>

  <!-- Results Section -->
  <div class="results-section">
    <div class="results-header">
      <div class="results-count">
        <span data-translate="calc_found">Found</span> <span id="matchCount">16</span> <span data-translate="calc_schemes_text">Eligible Schemes</span>
      </div>
      <div class="sector-filter-tabs">
        <button class="tab-btn active" onclick="setSectorFilter('All', this)">All</button>
        <button class="tab-btn" onclick="setSectorFilter('Agriculture', this)" data-translate="sec_agri">🌱 Agriculture</button>
        <button class="tab-btn" onclick="setSectorFilter('Education', this)" data-translate="sec_edu">🎓 Education</button>
        <button class="tab-btn" onclick="setSectorFilter('Healthcare', this)" data-translate="sec_health">🏥 Healthcare</button>
        <button class="tab-btn" onclick="setSectorFilter('Housing', this)" data-translate="sec_house">🏠 Housing</button>
      </div>
    </div>

    <div class="matches-grid" id="matchesContainer">
      <!-- Dynamic Matches Rendered Here -->
    </div>
  </div>
</div>

<script src="/static/js/translations.js"></script>
<script src="/static/js/ui_effects.js"></script>
<script>
  const SCHEMES_DB = [
    // Agriculture
    {
      id: "pmkisan",
      name_en: "PM Kisan Samman Nidhi",
      name_te: "పీఎం కిసాన్ సమ్మాన్ నిధి",
      sector: "Agriculture",
      benefit_en: "₹6,000 per year direct bank transfer in 3 installments",
      benefit_te: "సంవత్సరానికి ₹6,000 నగదు బదిలీ (3 విడతలలో)",
      desc_en: "Income support for all landholding farmers to meet agriculture & domestic expenses.",
      desc_te: "భూమి కలిగిన రైతులకు వ్యవసాయ ఖర్చుల నిమిత్తం ఆర్థిక సహాయం అందించే పథకం.",
      official: "https://pmkisan.gov.in/",
      matchScore: function(p) {
        if (p.occupation === 'farmer' || p.land === 'small' || p.land === 'large') return 100;
        if (p.occupation === 'all' && p.land !== 'none') return 80;
        return 20;
      },
      reasons_en: ["Landholding farmer families", "Valid Aadhaar-linked bank account", "Direct Benefit Transfer eligible"],
      reasons_te: ["భూమి కలిగిన రైతు కుటుంబాలు", "ఆధార్ అనుసంధాన బ్యాంక్ ఖాతా", "ప్రత్యక్ష నగదు బదిలీ అర్హత"]
    },
    {
      id: "fasalbima",
      name_en: "Pradhan Mantri Fasal Bima Yojana",
      name_te: "ప్రధాన మంత్రి ఫసల్ బీమా యోజన",
      sector: "Agriculture",
      benefit_en: "Comprehensive crop loss insurance coverage at low 1.5% - 2% premium",
      benefit_te: "తక్కువ ప్రీమియంతో సమగ్ర పంట నష్ట పరిహార బీమా రక్షణ",
      desc_en: "Protects farmers against unavoidable natural calamities, pests, and drought loss.",
      desc_te: "ప్రకృతి వైపరీత్యాలు, తెగుళ్లు మరియు కరువు వల్ల నష్టపోయిన రైతులకు బీమా రక్షణ.",
      official: "https://pmfby.gov.in/",
      matchScore: function(p) {
        if (p.occupation === 'farmer' || p.land === 'small' || p.land === 'large') return 100;
        if (p.land !== 'none') return 80;
        return 30;
      },
      reasons_en: ["Cultivating notified crops", "Insurance for natural calamity protection"],
      reasons_te: ["నోటిఫై చేసిన పంటలను సాగు చేయడం", "ప్రకృతి వైపరీత్యాల బీమా రక్షణ"]
    },
    {
      id: "sinchai",
      name_en: "Krishi Sinchai Yojana (PMKSY)",
      name_te: "కృషి సించాయి యోజన (PMKSY)",
      sector: "Agriculture",
      benefit_en: "Up to 55% - 90% subsidy on drip and sprinkler micro-irrigation systems",
      benefit_te: "డ్రిప్ మరియు స్ప్రింక్లర్ సూక్ష్మ నీటిపారుదలపై 55% నుండి 90% వరకు సబ్సిడీ",
      desc_en: "Enhances on-farm water access and efficiency with modern irrigation technologies.",
      desc_te: "వ్యవసాయ భూముల్లో నీటి సామర్థ్యం మరియు ఆధునిక సాగు పద్ధతులను పెంచడం.",
      official: "https://www.pmksy.gov.in/",
      matchScore: function(p) {
        if (p.occupation === 'farmer' || p.land === 'small') return 100;
        return 40;
      },
      reasons_en: ["Access to farm water resources", "Subsidy on micro-irrigation kits"],
      reasons_te: ["సాగునీటి వనరులను మెరుగుపరచడం", "మైక్రో ఇరిగేషన్ కిట్లపై సబ్సిడీ"]
    },
    {
      id: "agriinfra",
      name_en: "Agriculture Infrastructure Fund",
      name_te: "వ్యవసాయ మౌలిక వసతుల నిధి",
      sector: "Agriculture",
      benefit_en: "Interest subvention of 3% per annum on loans up to ₹2 Crore for agri infra",
      benefit_te: "₹2 కోట్ల వరకు రుణాలపై వార్షిక 3% వడ్డీ రాయితీ",
      desc_en: "Medium to long-term financing for post-harvest storage, cold chains, and processing units.",
      desc_te: "కోల్డ్ స్టోరేజ్, గిడ్డంగులు మరియు ప్రాసెసింగ్ యూనిట్ల నిర్మాణానికి రుణాలు.",
      official: "https://agriinfra.dac.gov.in/",
      matchScore: function(p) {
        if (p.occupation === 'farmer' || p.land === 'large') return 90;
        return 40;
      },
      reasons_en: ["Setting up cold stores & warehouses", "Reduced interest on agri-loans"],
      reasons_te: ["కోల్డ్ స్టోర్ & గోడౌన్ల ఏర్పాటు", "వ్యవసాయ రుణాలపై తక్కువ వడ్డీ"]
    },

    // Education
    {
      id: "vidyadeevena",
      name_en: "Jagananna Vidya Deevena",
      name_te: "జగనన్న విద్యా దీవెన",
      sector: "Education",
      benefit_en: "100% Full Tuition Fee Reimbursement credited directly to mother's account",
      benefit_te: "100% పూర్తి కాలేజీ ఫీజు రీయింబర్స్‌మెంట్ తల్లుల ఖాతాలో జమ",
      desc_en: "Financial assistance for students pursuing ITI, Polytechnic, Degree, and Postgraduate courses.",
      desc_te: "ఐటీఐ, పాలిటెక్నిక్, డిగ్రీ మరియు పీజీ విద్యార్థుల ఫీజులను ప్రభుత్వం చెల్లిస్తుంది.",
      official: "https://jnanabhumi.ap.gov.in/",
      matchScore: function(p) {
        if (p.education === 'college' && (p.income === 'bpl' || p.income === 'ews')) return 100;
        if (p.occupation === 'student' || p.education === 'college') return 90;
        return 30;
      },
      reasons_en: ["Enrolled in recognized higher education college", "Annual household income below ₹2.5 Lakhs", "Direct deposit support"],
      reasons_te: ["గుర్తింపు పొందిన కళాశాలలో ప్రవేశం", "వార్షిక ఆదాయం ₹2.5 లక్షల లోపు", "నేరుగా ఫీజు చెల్లింపు"]
    },
    {
      id: "vasathideevena",
      name_en: "Jagananna Vasathi Deevena",

  let currentSectorFilter = 'All';

  function getProfile() {
    return {
      occupation: document.getElementById('occupation').value,
      income: document.getElementById('income').value,
      land: document.getElementById('land').value,
      education: document.getElementById('education').value,
      housing: document.getElementById('housing').value
    };
  }

  function runCalculator() {
    const profile = getProfile();
    const container = document.getElementById('matchesContainer');
    container.innerHTML = '';
    const currentLang = localStorage.getItem('myparishkar_lang') || 'en';

    const scored = SCHEMES_DB.map(s => {
      return {
        ...s,
        score: s.matchScore(profile)
      };
    }).filter(s => {
      if (currentSectorFilter !== 'All' && s.sector !== currentSectorFilter) {
        return false;
      }
      return s.score >= 40;
    }).sort((a, b) => b.score - a.score);

    document.getElementById('matchCount').textContent = scored.length;

    if (scored.length === 0) {
      const emptyMsg = currentLang === 'te' 
        ? `<h3>ఈ విభాగంలో మీ వివరాలకు సరిపోలే పథకాలు కనుగొనబడలేదు.</h3><p style="margin-top: 8px;">ఆదాయ వర్గాన్ని మార్చండి లేదా "అన్ని రంగాలు" ఎంచుకోండి.</p>`
        : `<h3>No schemes matched your exact criteria in this sector.</h3><p style="margin-top: 8px;">Try adjusting your income range or selecting "All Sectors".</p>`;
      container.innerHTML = `
        <div style="background: white; padding: 40px; border-radius: 16px; text-align: center; color: #64748b;">
          ${emptyMsg}
        </div>
      `;
      return;
    }

    scored.forEach(scheme => {
      let badgeClass = 'score-mid';
      let badgeText = currentLang === 'te' ? 'అర్హత ఉన్న పథకం' : 'Eligible Match';
      if (scheme.score >= 90) {
        badgeClass = 'score-100';
        badgeText = currentLang === 'te' ? '🎯 100% ఉత్తమ అర్హత' : '🎯 100% High Match';
      } else if (scheme.score >= 70) {
        badgeClass = 'score-high';
        badgeText = currentLang === 'te' ? '🌟 బలమైన సరిపోలిక' : '🌟 Strong Match';
      }

      const schemeName = currentLang === 'te' ? (scheme.name_te || scheme.name_en) : scheme.name_en;
      const benefitText = currentLang === 'te' ? (scheme.benefit_te || scheme.benefit_en) : scheme.benefit_en;
      const descText = currentLang === 'te' ? (scheme.desc_te || scheme.desc_en) : scheme.desc_en;
      const reasonsList = currentLang === 'te' ? (scheme.reasons_te || scheme.reasons_en) : scheme.reasons_en;
      const applyBtnText = currentLang === 'te' ? 'ఆన్‌లైన్‌లో దరఖాస్తు →' : 'Apply Online Now →';

      const card = document.createElement('div');
      card.className = 'match-card';
      card.innerHTML = `
        <div>
          <div class="match-top">
            <span class="badge-tag" style="background: #e8f5e9; color: #2e7d32; font-weight: bold; margin: 0;">${scheme.sector}</span>
            <span class="score-badge ${badgeClass}">${badgeText}</span>
          </div>
          <h3 class="match-title">${schemeName}</h3>
          <div class="benefit-ribbon">🎁 ${benefitText}</div>
          <p class="match-desc">${descText}</p>
          <ul class="qualify-reasons">
            ${reasonsList.map(r => `<li><span>✓</span> ${r}</li>`).join('')}
          </ul>
        </div>
        <div class="match-actions">
          <a href="/apply/?sector=${encodeURIComponent(scheme.sector)}&scheme=${encodeURIComponent(scheme.name_en)}" class="apply-btn">${applyBtnText}</a>
          <a href="${scheme.official}" target="_blank" rel="noopener" class="official-link">Portal ↗</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function setSectorFilter(sector, btn) {
    currentSectorFilter = sector;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    runCalculator();
  }

  function resetForm() {
    document.getElementById('occupation').value = 'all';
    document.getElementById('income').value = 'bpl';
    document.getElementById('land').value = 'any';
    document.getElementById('education').value = 'any';
    document.getElementById('housing').value = 'any';
    currentSectorFilter = 'All';
    document.querySelectorAll('.tab-btn').forEach((b, idx) => {
      b.classList.toggle('active', idx === 0);
    });
    runCalculator();
  }

  window.addEventListener('languageChanged', () => {
    runCalculator();
  });

  // Initial Run
  runCalculator();
